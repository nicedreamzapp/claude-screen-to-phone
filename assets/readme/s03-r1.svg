<svg xmlns="http://www.w3.org/2000/svg" width="820" height="109" viewBox="0 0 820 109" role="img" aria-label="Listener daemon. Checks the Messages database every 2 seconds. Short replies. Phone replies are capped at 3 sentences. Local bridge. Reads chat.db directly, no server."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="109" rx="10"/></clipPath><rect width="265.3" height="109" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">Listener daemon</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Checks the Messages</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">database every 2 seconds</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="109" rx="10"/></clipPath><rect width="265.3" height="109" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">Short replies</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Phone replies are capped at</text><text x="135" text-anchor="middle" y="93"